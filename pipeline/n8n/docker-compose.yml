# n8n for the wiki — Docker stack (optional automation layer).
#
# A self-contained n8n instance that watches the vault's 00-Raw/ folders for new
# files and triggers the ingest. Runs alongside anything else on the host with
# its own named volume so state is never shared.
#
# Replace the ${PLACEHOLDERS} below (or supply them via a .env file next to this
# compose file). See .env.example at the repo root.
#   SERVER_IP    the host's address others reach it on (e.g. a Tailscale IP)
#   N8N_PORT     host port to publish (default 5678; change if something else uses it)
#   VAULT_PATH   absolute path to the vault on the host (mounted read-only)
#   TZ           your timezone (e.g. Europe/Dublin)
#
# Prereq (ONE-TIME, privileged): the user running compose must be in the docker
# group:  sudo usermod -aG docker "$USER"   then re-login (or `newgrp docker`).
#
# Bring up / down:
#   docker compose -f pipeline/n8n/docker-compose.yml up -d
#   docker compose -f pipeline/n8n/docker-compose.yml ps
#   docker compose -f pipeline/n8n/docker-compose.yml down
#
# UI: http://${SERVER_IP}:${N8N_PORT}  (set the owner account on first load).
# `restart: unless-stopped` means the docker daemon restarts it on boot — no
# systemd unit needed.
#
# NOTE: the watcher's executeCommand runs INSIDE the container, which has the
# vault mounted read-only at /vault but no git/model. The trigger SSHes back to
# the host to run ingest_one.sh there. See vault-ingest.workflow.json.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: llm-wiki-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"     # host -> container's default 5678
    environment:
      - N8N_PORT=5678
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_PROTOCOL=http
      - N8N_HOST=${SERVER_IP}
      - WEBHOOK_URL=http://${SERVER_IP}:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      # Served over plain HTTP on a private network (e.g. a tailnet). A secure
      # cookie would block UI login over http; disable it for that setup. If you
      # put n8n behind HTTPS, remove this line.
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ${VAULT_PATH}:/vault:ro       # raw sources visible to the file-watcher trigger

volumes:
  n8n_data:
